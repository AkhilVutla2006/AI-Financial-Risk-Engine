<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Financial Risk Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            transition: transform 0.2s ease;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .file-input-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            border: 2px dashed var(--border);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary);
            background: #ecfdf5;
        }

        .file-input-wrapper input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .upload-btn:hover {
            background-color: var(--primary-dark);
        }

        .results {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .probability-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f0fdf4;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #bbf7d0;
        }

        .prob-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .features-list {
            list-style: none;
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .impact-positive {
            color: #ef4444;
            font-weight: 500;
        }

        .impact-negative {
            color: #10b981;
            font-weight: 500;
        }

        .explanation {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            color: #334155;
            white-space: pre-wrap;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 1rem;
            color: var(--primary-dark);
            font-weight: 600;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>RiskEngine AI</h1>
            <p class="subtitle">Upload your AIS PDF for instant risk analysis and AI insights</p>
        </header>

        <div class="card">
            <form id="uploadForm" class="upload-section">
                <div class="file-input-wrapper">
                    <p id="fileName">Drop AIS PDF here or click to browse</p>
                    <input type="file" name="file" id="file" accept=".pdf" required>
                </div>
                <button type="submit" class="upload-btn">Analyze Document</button>
            </form>
            <div id="loading">
                <div class="spinner"></div> Processing document...
            </div>
        </div>

        <div id="results" class="results">
            <div class="card" style="border-left: 4px solid var(--primary);">
                <span
                    style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Source
                    Document</span>
                <h2 id="resultFilename" style="font-size: 1.25rem; margin-top: 0.25rem;">-</h2>
            </div>

            <div class="card">
                <h3>Risk Assessment</h3>
                <div class="probability-card">
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Debt Probability</p>
                        <p class="prob-value" id="probValue">0%</p>
                    </div>
                    <div id="riskLabel" style="padding: 0.5rem 1rem; border-radius: 2rem; font-weight: 700;"></div>
                </div>
            </div>

            <div class="card">
                <h3>Key Risk Factors</h3>
                <ul class="features-list" id="featuresList"></ul>
            </div>

            <div class="card">
                <h3>AI Insights</h3>
                <div class="explanation" id="llmExplanation"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file');
        const fileNameDisp = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisp.textContent = e.target.files[0].name;
                fileNameDisp.style.color = 'var(--primary-dark)';
            }
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            form.style.display = 'none';
            loading.style.display = 'block';
            results.style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                // 1. Get Prediction Data
                const predRes = await fetch('/upload', { method: 'POST', body: formData });
                const predData = await predRes.json();

                // Fill Pred Data
                document.getElementById('resultFilename').textContent = predData.filename || 'Unknown File';
                document.getElementById('probValue').textContent = (predData.predicted_probability * 100).toFixed(1) + '%';
                const label = document.getElementById('riskLabel');
                if (predData.prediction === 1) {
                    label.textContent = 'HIGH RISK';
                    label.style.background = '#fee2e2';
                    label.style.color = '#ef4444';
                } else {
                    label.textContent = 'LOW RISK';
                    label.style.background = '#dcfce7';
                    label.style.color = '#10b981';
                }

                const list = document.getElementById('featuresList');
                list.innerHTML = '';
                predData.top_features.forEach(f => {
                    const li = document.createElement('li');
                    li.className = 'feature-item';
                    li.innerHTML = `
                        <span>${f.feature.replace(/_/g, ' ')}</span>
                        <span class="${f.impact > 0 ? 'impact-positive' : 'impact-negative'}">
                            ${f.impact > 0 ? '▲' : '▼'} ${(f.impact * 10).toFixed(2)}
                        </span>
                    `;
                    list.appendChild(li);
                });

                // 2. Stream LLM Explanation
                results.style.display = 'flex';
                loading.style.display = 'none';

                const llmDiv = document.getElementById('llmExplanation');
                llmDiv.textContent = '';

                // We'll call /llm-explain with the prediction data we just got
                const llmRes = await fetch('/llm-explain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(predData)
                });

                const reader = llmRes.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    llmDiv.textContent += decoder.decode(value);
                }

            } catch (err) {
                console.error(err);
                alert('Analysis failed. Please try again.');
                form.style.display = 'flex';
                loading.style.display = 'none';
            }
        };
    </script>
</body>

</html>
